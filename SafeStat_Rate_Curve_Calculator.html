<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeStat Rate Curve Calculator</title>
<style>
:root {
  --purple:#381360;--purple-light:#f0edff;--purple-mid:#7c5fa0;
  --mint:#2a8a4a;--amber:#b85c00;--blue:#1a4f7a;
  --gray-50:#f8f8f8;--gray-100:#f0f0f0;--gray-200:#e0e0e0;--gray-400:#999;
  --text:#1a1a1a;--border:rgba(0,0,0,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--gray-50);}
header{background:var(--purple);color:white;padding:18px 32px;display:flex;align-items:baseline;gap:16px;}
header h1{font-size:20px;font-weight:600;}
header span{font-size:12px;opacity:0.6;}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 57px);}
.left{background:white;border-right:1px solid var(--border);padding:24px 20px;overflow-y:auto;}
.right{padding:24px 28px;overflow-y:auto;}

.city-wrap{background:var(--purple-light);border-radius:12px;padding:20px;margin-bottom:24px;text-align:center;}
.city-wrap label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--purple-mid);margin-bottom:8px;text-transform:uppercase;}
.city-num{font-size:64px;font-weight:800;color:var(--purple);line-height:1;margin-bottom:6px;}
.city-num input{width:100%;font-size:64px;font-weight:800;color:var(--purple);border:none;background:transparent;text-align:center;outline:none;line-height:1;}
.city-wrap input[type=range]{width:100%;margin-top:8px;accent-color:var(--purple);}
.anchor-marks{display:flex;justify-content:space-between;font-size:10px;color:var(--purple-mid);margin-top:4px;font-weight:600;}

.sh{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--gray-400);text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gray-200);}

.ss-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:20px;}
.ss-field label{display:block;font-size:10px;font-weight:600;color:var(--gray-400);text-align:center;margin-bottom:3px;}
.ss-field input{width:100%;font-size:12px;font-weight:600;padding:4px 2px;border:1px solid var(--gray-200);border-radius:5px;background:var(--gray-50);text-align:center;color:var(--blue);}

.pd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px;}
.pd-field label{display:block;font-size:10px;font-weight:600;color:var(--gray-400);text-align:center;margin-bottom:3px;}
.pd-field input{width:100%;font-size:12px;font-weight:600;padding:4px 2px;border:1px solid var(--gray-200);border-radius:5px;background:var(--gray-50);text-align:center;}
.pd-total{font-size:11px;color:var(--gray-400);text-align:right;margin-bottom:20px;}

/* rate cards */
.rate-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.rate-card{background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.rate-card-head{padding:9px 14px;font-size:11px;font-weight:700;color:white;}
.rate-card-body{padding:12px 14px;}
.rate-val{font-size:28px;font-weight:800;line-height:1;}
.rate-sub{font-size:11px;color:var(--gray-400);margin-top:4px;}

/* chart */
.chart-card{background:white;border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:20px;}
.chart-title{font-size:13px;font-weight:600;margin-bottom:4px;}
.chart-sub{font-size:11px;color:var(--gray-400);margin-bottom:12px;}
.chart-container{position:relative;height:220px;cursor:crosshair;}

/* summary */
.sum-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.sum-card{background:white;border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.sum-card.hi{background:var(--purple);border-color:var(--purple);}
.sum-card.hi .sl,.sum-card.hi .ss2{color:rgba(255,255,255,0.65);}
.sum-card.hi .sv{color:white;}
.sl{font-size:11px;color:var(--gray-400);margin-bottom:3px;}
.sv{font-size:20px;font-weight:700;}
.ss2{font-size:11px;color:var(--gray-400);margin-top:2px;}

/* table */
.ptable{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.ptable th{padding:9px 14px;text-align:right;font-size:11px;font-weight:700;background:var(--purple);color:white;}
.ptable th:first-child{text-align:left;}
.ptable td{padding:8px 14px;text-align:right;border-bottom:1px solid var(--gray-100);font-size:12px;}
.ptable td:first-child{text-align:left;color:#555;font-size:11px;}
.ptable tr.sec td{background:var(--gray-50);font-weight:700;border-top:2px solid var(--gray-200);}
.ptable tr.hi td{background:var(--purple-light);font-weight:700;color:var(--purple);border-top:2px solid var(--purple);}
.ptable tr.sub td:first-child{padding-left:24px;color:var(--gray-400);}
.ptable tr.div td{border-top:2px solid var(--gray-200);background:var(--gray-50);font-weight:600;}
.b{color:var(--blue);font-weight:600;}
.c{color:var(--mint);font-weight:600;}
</style>
</head>
<body>
<header>
  <h1>SafeStat℠ Rate Curve Calculator</h1>
  <span>Smooth curve · 5 anchors · Click chart to set city count</span>
</header>
<div class="layout">
  <div class="left">
    <div class="city-wrap">
      <label>Total cities</label>
      <div class="city-num"><input type="number" id="cc" value="35" min="1" max="50" oninput="fromInput()"></div>
      <input type="range" id="cs" min="1" max="50" value="35" oninput="fromSlider()">
      <div class="anchor-marks"><span>1</span><span>▲9</span><span>▲25</span><span>▲35</span><span>50</span></div>
    </div>

    <div class="sh">Ballmer sunset (%)</div>
    <div class="ss-grid">
      <div class="ss-field"><label>Yr 1</label><input type="number" id="ss1" value="100" min="0" max="100" oninput="calc()"></div>
      <div class="ss-field"><label>Yr 2</label><input type="number" id="ss2" value="100" min="0" max="100" oninput="calc()"></div>
      <div class="ss-field"><label>Yr 3</label><input type="number" id="ss3" value="100" min="0" max="100" oninput="calc()"></div>
      <div class="ss-field"><label>Yr 4</label><input type="number" id="ss4" value="50" min="0" max="100" oninput="calc()"></div>
      <div class="ss-field"><label>Yr 5</label><input type="number" id="ss5" value="25" min="0" max="100" oninput="calc()"></div>
    </div>

    <div class="sh">Product dev ($M)</div>
    <div class="pd-grid">
      <div class="pd-field"><label>Y1</label><input type="number" id="p1" value="4.95" step="0.01" oninput="calc()"></div>
      <div class="pd-field"><label>Y2</label><input type="number" id="p2" value="2.25" step="0.01" oninput="calc()"></div>
      <div class="pd-field"><label>Y3</label><input type="number" id="p3" value="2.25" step="0.01" oninput="calc()"></div>
      <div class="pd-field"><label>Y4</label><input type="number" id="p4" value="2.25" step="0.01" oninput="calc()"></div>
    </div>
    <div class="pd-total" id="pdt">Total: $11.70M</div>
  </div>

  <div class="right">
    <div class="rate-cards" id="rateCards"></div>

    <div class="chart-card">
      <div class="chart-title">Rate curves — hover to explore, click to select</div>
      <div class="chart-sub">Stand-up · Support · License by cumulative city count (1–50)</div>
      <div class="chart-container">
        <canvas id="rc"></canvas>
      </div>
    </div>

    <div class="sum-cards" id="sumCards"></div>
    <table class="ptable" id="ptable"></table>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── POLYNOMIAL FIT ──────────────────────────────────────────────────────
function fitPoly(xs, ys){
  const n=xs.length, aug=xs.map((x,i)=>[x**4,x**3,x**2,x,1,ys[i]]);
  for(let c=0;c<5;c++){
    let mx=c;
    for(let r=c+1;r<5;r++) if(Math.abs(aug[r][c])>Math.abs(aug[mx][c])) mx=r;
    [aug[c],aug[mx]]=[aug[mx],aug[c]];
    for(let r=c+1;r<5;r++){
      const f=aug[r][c]/aug[c][c];
      for(let j=c;j<=5;j++) aug[r][j]-=f*aug[c][j];
    }
  }
  const co=new Array(5).fill(0);
  for(let i=4;i>=0;i--){
    co[i]=aug[i][5]/aug[i][i];
    for(let j=i-1;j>=0;j--) aug[j][5]-=aug[j][i]*co[i];
  }
  return co;
}
function pv(co,x){ return co[0]*x**4+co[1]*x**3+co[2]*x**2+co[3]*x+co[4]; }

const AX=[1,9,25,35,50];
const AY={su:[400000,300000,235000,190000,140000],os:[350000,250000,195000,165000,135000],lic:[200000,190000,190000,180000,170000]};
const FL={su:140000,os:135000,lic:170000};
const PL={su:fitPoly(AX,AY.su),os:fitPoly(AX,AY.os),lic:fitPoly(AX,AY.lic)};
const rate=(m,n)=>Math.max(FL[m],pv(PL[m],Math.min(n,50)));

const fm=n=>n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+Math.round(n/1e3).toLocaleString()+'K':'$'+n.toFixed(0);
const fmM=n=>'$'+(n/1e6).toFixed(2)+'M';
const g=id=>+document.getElementById(id).value||0;

let currentN = 35;
let chartInst = null;

function setN(n){
  n = Math.max(1, Math.min(50, Math.round(n)));
  currentN = n;
  document.getElementById('cc').value = n;
  document.getElementById('cs').value = n;
  updateMarker();
  calc();
}

function fromInput(){ setN(+document.getElementById('cc').value); }
function fromSlider(){ setN(+document.getElementById('cs').value); }

function updateMarker(){
  if(!chartInst) return;
  // update vertical line annotation
  chartInst.options.plugins.annotation.annotations.vline.xMin = currentN-1;
  chartInst.options.plugins.annotation.annotations.vline.xMax = currentN-1;
  chartInst.options.plugins.annotation.annotations.vline.label.content = `City ${currentN}`;
  chartInst.update('none');
}

function buildChart(){
  const xs = Array.from({length:50},(_,i)=>i+1);
  const suV  = xs.map(x=>rate('su',x)/1000);
  const osV  = xs.map(x=>rate('os',x)/1000);
  const licV = xs.map(x=>rate('lic',x)/1000);

  const ctx = document.getElementById('rc');
  if(chartInst) chartInst.destroy();

  chartInst = new Chart(ctx,{
    type:'line',
    data:{
      labels:xs,
      datasets:[
        {label:'Stand-up ($K)', data:suV,  borderColor:'#381360', borderWidth:2.5, pointRadius:0, tension:0.35, fill:false},
        {label:'Support ($K)',  data:osV,  borderColor:'#1a4f7a', borderWidth:2.5, pointRadius:0, tension:0.35, fill:false},
        {label:'License ($K)',  data:licV, borderColor:'#2a8a4a', borderWidth:2.5, pointRadius:0, tension:0.35, fill:false},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{display:true, position:'top', labels:{font:{size:11}, padding:14, boxWidth:12}},
        tooltip:{
          callbacks:{
            title: ctx => `City ${ctx[0].label}`,
            label: ctx => `${ctx.dataset.label}: $${ctx.parsed.y.toFixed(0)}K`,
            afterBody: items => {
              const x = +items[0].label;
              const su=rate('su',x), os=rate('os',x), lic=rate('lic',x);
              const ss=[g('ss1'),g('ss2'),g('ss3'),g('ss4'),g('ss5')].map(v=>v/100);
              const bal = su*ss[0] + os*(ss[1]+ss[2]+ss[3]+ss[4]) + lic*(ss[0]+ss[1]+ss[2]+ss[3]+ss[4]);
              const tot = su + os*4 + lic*5;
              return [`──────────────`, `Per-city lifecycle: $${(tot/1000).toFixed(0)}K`, `Ballmer/city: $${(bal/1000).toFixed(0)}K`];
            }
          }
        },
        annotation:{
          annotations:{
            vline:{
              type:'line', xMin:currentN-1, xMax:currentN-1,
              borderColor:'rgba(184,92,0,0.6)', borderWidth:2, borderDash:[5,4],
              label:{display:true, content:`City ${currentN}`, position:'start',
                backgroundColor:'rgba(184,92,0,0.85)', color:'white', font:{size:10, weight:'bold'}, padding:{x:6,y:3}}
            }
          }
        }
      },
      scales:{
        x:{title:{display:true, text:'Cumulative cities', font:{size:11}}, grid:{color:'rgba(0,0,0,0.04)'}, ticks:{font:{size:10}, maxTicksLimit:10}},
        y:{min:0, max:450, title:{display:true, text:'Rate ($K)', font:{size:11}}, grid:{color:'rgba(0,0,0,0.04)'}, ticks:{callback:v=>'$'+v+'K', font:{size:10}}}
      },
      onClick(evt){
        const pts = chartInst.getElementsAtEventForMode(evt,'index',{intersect:false},false);
        if(pts.length){ setN(+chartInst.data.labels[pts[0].index]); }
      }
    }
  });
}

function calc(){
  const n = currentN;
  const pd = g('p1')+g('p2')+g('p3')+g('p4');
  document.getElementById('pdt').textContent=`Total: $${pd.toFixed(2)}M (100% Ballmer)`;

  const suN=rate('su',n), osN=rate('os',n), licN=rate('lic',n);
  const ss=[g('ss1'),g('ss2'),g('ss3'),g('ss4'),g('ss5')].map(v=>v/100);

  const suMult  = ss[0];
  const osMult  = ss[1]+ss[2]+ss[3]+ss[4];
  const licMult = ss[0]+ss[1]+ss[2]+ss[3]+ss[4];

  const balPC = suN*suMult + osN*osMult + licN*licMult;
  const totPC = suN + osN*4 + licN*5;
  const citPC = totPC - balPC;

  const swT=totPC*n, swB=balPC*n, swC=citPC*n;
  const gT=swT/1e6+pd, bT=swB/1e6+pd, cT=swC/1e6;

  // rate cards
  document.getElementById('rateCards').innerHTML=`
    <div class="rate-card">
      <div class="rate-card-head" style="background:var(--purple)">Stand-up rate</div>
      <div class="rate-card-body">
        <div class="rate-val" style="color:var(--purple)">${fm(suN)}</div>
        <div class="rate-sub">per new city · one-time</div>
      </div>
    </div>
    <div class="rate-card">
      <div class="rate-card-head" style="background:var(--blue)">Support rate</div>
      <div class="rate-card-body">
        <div class="rate-val" style="color:var(--blue)">${fm(osN)}</div>
        <div class="rate-sub">per existing city · annual yrs 2–5</div>
      </div>
    </div>
    <div class="rate-card">
      <div class="rate-card-head" style="background:var(--mint)">License rate</div>
      <div class="rate-card-body">
        <div class="rate-val" style="color:var(--mint)">${fm(licN)}</div>
        <div class="rate-sub">per city · annual yrs 1–5</div>
      </div>
    </div>`;

  // summary cards
  document.getElementById('sumCards').innerHTML=`
    <div class="sum-card hi">
      <div class="sl">Total lifecycle</div>
      <div class="sv">${fmM(gT*1e6)}</div>
      <div class="ss2">${n} cities · incl. prod dev</div>
    </div>
    <div class="sum-card">
      <div class="sl">Ballmer total</div>
      <div class="sv" style="color:var(--blue)">${fmM(bT*1e6)}</div>
      <div class="ss2">${(bT/gT*100).toFixed(1)}% of total</div>
    </div>
    <div class="sum-card">
      <div class="sl">City contribution</div>
      <div class="sv" style="color:var(--mint)">${fmM(cT*1e6)}</div>
      <div class="ss2">${(cT/gT*100).toFixed(1)}% of total</div>
    </div>
    <div class="sum-card">
      <div class="sl">Ballmer per city</div>
      <div class="sv" style="color:var(--purple)">${fmM(balPC)}</div>
      <div class="ss2">software only</div>
    </div>`;

  // pricing table
  const rows=[
    {l:'1. Software costs (stand-up / support / license)',t:fmM(swT),b:fmM(swB),c:fmM(swC),cls:'sec'},
    {l:'   City-paid software',t:'',b:'',c:fmM(swC),cls:'sub',cc:true},
    {l:'   Ballmer-paid software',t:'',b:fmM(swB),c:'',cls:'sub',bc:true},
    {l:'2. Product development',t:fmM(pd*1e6),b:fmM(pd*1e6),c:'—',cls:'sec'},
    {l:'3. Ballmer total (software + product dev)',t:'',b:fmM(bT*1e6),c:'',cls:'hi'},
    {l:'4. Ballmer cost per city (software only)',t:'',b:fmM(balPC),c:'',cls:'div'},
    {l:'5. Total cost per city (software only)',t:fmM(totPC),b:'',c:'',cls:'div'},
  ];
  let html=`<thead><tr><th>Item</th><th>Total</th><th>Ballmer</th><th>City</th></tr></thead><tbody>`;
  for(const r of rows) html+=`<tr class="${r.cls}"><td>${r.l}</td><td>${r.t}</td><td class="${r.bc?'b':''}">${r.b}</td><td class="${r.cc?'c':''}">${r.c}</td></tr>`;
  html+='</tbody>';
  document.getElementById('ptable').innerHTML=html;

  updateMarker();
}

// Load annotation plugin
const annotationPlugin = {
  id:'annotation',
  afterDraw(chart){
    const ann = chart.options.plugins.annotation?.annotations?.vline;
    if(!ann) return;
    const {ctx, scales:{x,y}} = chart;
    const xPx = x.getPixelForValue(ann.xMin);
    ctx.save();
    ctx.strokeStyle = ann.borderColor;
    ctx.lineWidth = ann.borderWidth;
    ctx.setLineDash(ann.borderDash||[]);
    ctx.beginPath();
    ctx.moveTo(xPx, y.top);
    ctx.lineTo(xPx, y.bottom);
    ctx.stroke();
    // label
    const lbl = ann.label;
    if(lbl?.display){
      ctx.fillStyle = lbl.backgroundColor;
      ctx.font = `${lbl.font?.weight||'normal'} ${lbl.font?.size||11}px Arial`;
      const tw = ctx.measureText(lbl.content).width;
      const px = lbl.padding?.x||4, py = lbl.padding?.y||3;
      const bx = xPx+4, by = y.top+4;
      ctx.fillRect(bx-px, by-py, tw+px*2, 16+py*2);
      ctx.fillStyle = lbl.color||'white';
      ctx.fillText(lbl.content, bx, by+12);
    }
    ctx.restore();
  }
};
Chart.register(annotationPlugin);

buildChart();
calc();
</script>
</body>
</html>
